<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RIMS — Sign in</title>
<link rel="icon" type="image/svg+xml" href="/assets/brand/RIMS_icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0060A8; --blueL:#1a86d6; --blueD:#024e86; --navy:#00335f;
  --node:#8fd0ff; --teal:#0072bb; --tealL:#1f93e3;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:'Nunito','Be Vietnam Pro',system-ui,sans-serif;
  color:#eaf3fb; -webkit-font-smoothing:antialiased;
  background:linear-gradient(140deg,#1a86d6 0%,#0060A8 54%,#024e86 100%);
  min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px;
}
.card{
  width:min(93vw,560px);
  background:rgba(0,38,70,.55);
  backdrop-filter:blur(9px) saturate(1.1); -webkit-backdrop-filter:blur(9px) saturate(1.1);
  border:1px solid rgba(255,255,255,.13);
  border-radius:20px; padding:48px 48px 44px;
  box-shadow:0 24px 60px -18px rgba(0,20,40,.55), inset 0 1px 0 rgba(255,255,255,.06);
  text-align:center;
}
.logo{width:76px;height:76px;margin:0 auto 22px;filter:drop-shadow(0 4px 12px rgba(0,20,45,.4))}
.logo img{width:100%;height:100%;display:block}
.welcome{font-size:27px;font-weight:400;line-height:1.15;color:rgba(255,255,255,.9);margin:0}
.title{font-size:23px;font-weight:800;line-height:1.3;color:#fff;margin:6px 0 34px;letter-spacing:.2px}
.field{
  display:flex;align-items:center;gap:12px;
  height:56px;padding:0 16px;margin-bottom:16px;
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.15);
  border-radius:11px; transition:border-color .15s, box-shadow .15s, background .15s;
}
.field:focus-within{border-color:var(--tealL); background:rgba(255,255,255,.13); box-shadow:0 0 0 3px rgba(31,147,227,.28);}
.field svg.lead{width:20px;height:20px;flex:none;color:rgba(255,255,255,.62)}
.field input{flex:1;min-width:0;border:0;background:transparent;outline:0;font:inherit;font-size:16px;color:#fff}
.field input::placeholder{color:rgba(255,255,255,.55)}
.eye{border:0;background:transparent;cursor:pointer;padding:4px;display:flex;color:rgba(255,255,255,.55);transition:color .15s}
.eye:hover{color:rgba(255,255,255,.9)}
.eye svg{width:20px;height:20px}
.err{min-height:20px;margin:2px 0 14px;font-size:13.5px;font-weight:600;color:#ffc3bc;text-align:left;opacity:0;transition:opacity .15s}
.err.show{opacity:1}
.btn{
  width:100%;height:52px;border:0;border-radius:11px;cursor:pointer;
  font:inherit;font-size:16.5px;font-weight:700;color:#fff;letter-spacing:.3px;
  background:linear-gradient(180deg,#1f93e3,#0072bb);
  box-shadow:0 8px 20px -8px rgba(0,80,150,.7);
  transition:filter .15s, transform .05s;
}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{filter:grayscale(.3) brightness(.8);cursor:default}
@media(max-width:520px){.card{padding:36px 26px 32px}.welcome{font-size:23px}.title{font-size:20px}}
</style>
</head>
<body>
<main class="card">
  <div class="logo"><img src="/assets/brand/RIMS_icon.svg" alt="RIMS"></div>
  <p class="welcome">Welcome to</p>
  <h1 class="title">RIMS — Reservoirs Integrated Management System</h1>
  <form id="f" novalidate autocomplete="on">
    <label class="field">
      <svg class="lead" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm0 2c-4 0-9 2-9 5.5V22h18v-2.5C21 16 16 14 12 14Z"/></svg>
      <input name="username" placeholder="Username" autocomplete="username" autofocus spellcheck="false">
    </label>
    <label class="field">
      <svg class="lead" viewBox="0 0 24 24" fill="currentColor"><path d="M17 9V7a5 5 0 0 0-10 0v2H5v13h14V9h-2ZM9 7a3 3 0 0 1 6 0v2H9V7Zm3 6a1.6 1.6 0 0 1 .8 3v2.2a.8.8 0 0 1-1.6 0V16a1.6 1.6 0 0 1 .8-3Z"/></svg>
      <input id="pw" name="password" type="password" placeholder="Password" autocomplete="current-password">
      <button id="eye" class="eye" type="button" aria-label="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 3 18 18"/><path d="M10.6 6.2A9.9 9.9 0 0 1 12 6c6.5 0 10 6 10 6a17 17 0 0 1-3.4 3.9M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7a9.6 9.6 0 0 0 4.1-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button>
    </label>
    <div class="err" id="err"></div>
    <button class="btn" id="btn" type="submit">Login</button>
  </form>
</main>
<script>
  const f=document.getElementById('f'), err=document.getElementById('err'), btn=document.getElementById('btn');
  function showErr(m){err.textContent=m;err.classList.add('show');}
  function nextUrl(){try{const p=new URLSearchParams(location.search).get('next');if(p&&p.startsWith('/')&&!p.startsWith('//'))return p;}catch(e){}return '/';}
  f.addEventListener('submit',async(e)=>{
    e.preventDefault();err.classList.remove('show');
    const username=f.username.value.trim(), password=f.password.value;
    if(!username||!password){showErr('Please enter username and password.');return;}
    btn.disabled=true;const t=btn.textContent;btn.textContent='Signing in…';
    try{
      const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
      if(r.ok){location.replace(nextUrl());return;}
      const j=await r.json().catch(()=>({}));
      showErr(r.status===429?(j.msg||'Too many attempts. Please wait a moment.'):(j.msg||'Incorrect username or password.'));
    }catch(_){showErr('Cannot reach the server. Please try again.');}
    btn.disabled=false;btn.textContent=t;
  });

  const pw=document.getElementById('pw'), eye=document.getElementById('eye');
  const A=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>`,B=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 3 18 18"/><path d="M10.6 6.2A9.9 9.9 0 0 1 12 6c6.5 0 10 6 10 6a17 17 0 0 1-3.4 3.9M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7a9.6 9.6 0 0 0 4.1-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>`;
  eye.addEventListener('click',()=>{const s=pw.type==='password';pw.type=s?'text':'password';eye.innerHTML=s?B:A;eye.setAttribute('aria-label',s?'Hide password':'Show password');});
</script>
</body>
</html>
