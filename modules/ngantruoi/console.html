<script>
/* ══ HHT-SO (22/08/2026) · MỘT KIỂU VIẾT SỐ CHO CẢ MÀN HÌNH ══════════════════
   Ảnh màn hình trực 22/08 cho thấy HAI kiểu viết số cách nhau vài centimet trên
   cùng một console: ô KPI và nhãn trên hình dùng `toFixed` ⇒ dấu CHẤM
   ("Mực nước hồ 62.60 m", "5.8 giờ trước"), còn nhãn ngưỡng trên đồ thị dùng
   `toLocaleString('vi-VN')` ⇒ dấu PHẨY ("MN trước lũ 69,0"). Lớp bản đồ đã được
   nắn trong lô 2; console đập thì chưa — đây là phần còn lại.
   Vì sao lọt: đường DỮ LIỆU MINH HOẠ dùng `fmt()` (phẩy), đường DỮ LIỆU SỐNG
   dùng `toFixed` (chấm). Không ai thấy, vì bàn thử chỉ chạy nhánh minh hoạ.

   `useGrouping:false` là CỐ Ý: tiếng Việt ngăn nghìn bằng dấu CHẤM, nên
   1020 m³/s sẽ thành "1.020" — cạnh "62,60" thì rất dễ đọc nhầm. Bỏ ngăn nghìn.

   ⚠ CHỈ dùng cho số ĐƯA RA MÀN HÌNH. Giá trị máy (`input.value`, tham số tính
   toán, khoá JSON) phải giữ nguyên dạng máy. */
function hntSo(x,d){
  var n=Number(x);
  if(x==null||x===''||!isFinite(n))return '–';
  return n.toLocaleString('vi-VN',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:false});
}
</script>

<style id="hht-ctlresp">
/* ── HHT-CTLRESP · hàng điều khiển co giãn đồng nhịp ─────────────────────────
   Trước: mỗi .fld một cỡ cứng ⇒ khi co giãn thì gãy hàng lệch nhịp, chừa khoảng
   trống lởm chởm; ô ngày thấp hơn select 2px nên nhãn 3 cột không thẳng.
   Nay: flex có grow/shrink + trần bề rộng, nhãn nowrap, ô ngày cùng cỡ select. */
.ctl{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 12px}
.ctl>.fld{flex:1 1 148px;min-width:0;max-width:230px}
.ctl>.fld.fld-range{flex:2 1 300px;max-width:360px}
/* nhãn 3 cột phải CÙNG chiều cao, nếu không .ctl (align-items:flex-end) sẽ đẩy cột cao hơn lên lệch */
.ctl>.fld>label{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:16px;line-height:16px}
/* khối chọn khoảng: bỏ nhãn chữ (dài, chiếm chỗ) → chỉ còn biểu tượng lịch đứng đầu hàng ô ngày;
   giữ một ô trống cao đúng bằng nhãn để 3 cột vẫn thẳng mép trên/dưới */
.ctl>.fld>.rnglbl{display:block;height:16px}
.ctl .rngrow>.rngico{flex:none;font-size:12px;line-height:1;opacity:.8;padding-right:1px}
/* panel hẹp (băng phải/cửa sổ nhỏ): bỏ trần bề rộng để ô chiếm trọn hàng, không chừa mép lởm chởm */
@media(max-width:520px){.ctl>.fld,.ctl>.fld.fld-range{max-width:none}}
.ctl .fld select,.ctl .fld input{width:100%;min-width:0;box-sizing:border-box}
.ctl .rngrow{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap;row-gap:6px}
/* KHÔNG đặt min-width:0 cho ô ngày: để trình duyệt giữ bề rộng tối thiểu theo nội dung,
   nếu không giá trị dd/mm/yyyy bị nút lịch cắt mất. Hết chỗ thì ô thứ hai xuống dòng. */
.ctl .rngrow>input[type=date]{flex:1 1 0;min-width:138px}  /* 138 = bề rộng tối thiểu đo được của ô date (dd/mm/yyyy + nút lịch) */
.ctl .rngrow>.rngsep{flex:none}
.ctl .rngrow>input[type=date]{background:var(--panel2);color:var(--txt);border:1px solid var(--line);
  border-radius:7px;padding:6px 9px;font-size:12px;font-family:inherit;color-scheme:dark}
.ctl .rngrow>input[type=date]:focus{outline:none;border-color:#3d9be0;box-shadow:0 0 0 2px rgba(61,155,224,.18)}
.ctl .rngrow>.rngsep{color:var(--txt2);font-size:12px}

/* rất hẹp: 2 ô ngày xếp dọc (đủ chỗ đọc dd/mm/yyyy), mũi tên → thành ↓, biểu tượng lịch lên hàng nhãn */
@media(max-width:420px){
  .ctl>.fld>.rnglbl::before{content:"\1F4C5";font-size:12px;line-height:16px}
  .ctl .rngrow>.rngico{display:none}
  .ctl .rngrow>input[type=date]{flex:1 1 100%}
  .ctl .rngrow>.rngsep{flex:1 1 100%;text-align:center;font-size:0;line-height:0}
  .ctl .rngrow>.rngsep::before{content:"\2193";font-size:12px;line-height:1}
}
</style>

<script>
(function(){
  var SVGNS='http://www.w3.org/2000/svg';
  function el(t,a){var e=document.createElementNS(SVGNS,t);for(var k in a)e.setAttribute(k,a[k]);return e;}
  var CONC='#5b626c',CONC_S='#39424c',CONC_L='#566069',CONC_M='#4f565f',CONC_LT='#454c55',WATER='#378ADD',WLITE='#85B7EB',GRAY='#7e8690',WINK='#185FA5';
  var STEEL='#7d8aa0',STEEL_D='#3b4252';
  var SILL=48.60, CREST=57.80, GATE_H=3.40, NGATE=7;
  // Hình học theo bản vẽ thi công tràn Ngàn Trươi (đơn vị m): ngưỡng bệ van +48,55 · đỉnh trụ/đập +57,80
  // · bán kính van cung R=10,52 (R1052 bản vẽ) · sân/bể tiêu năng +46,40 · đáy móng +44,40
  // · trụ pin: mũ rộng 2,30 / thân 1,40. (Mốc +56,20 trên bản vẽ = cao trình ĐÁY DẦM, không liên quan van.)
  // Van cung 12,0×3,4 m (QĐ643 PL1): ĐỈNH lá van = ngưỡng 48,6 + 3,4 = +52,0 (= MNDBT, mực dâng bình thường).
  // Tim chốt (trunnion) đặt GIỮA cửa (SILL..GATE_TOP); R = 10,52 m (bản vẽ). LŨ vượt +52,0 -> MỞ cửa xả; hồ
  // dềnh tới MNLTK 54,64 / MNLKT 55,86 khi cửa ĐANG MỞ — KHÔNG phải mức cửa đóng phải giữ (nên van không cao tới đó).
  var R_GATE=10.52, APRON=46.40, FOUND=44.40, ROOF=61.60, WALL=59.00;
  // 5 mực nước thiết kế Ngàn Trươi (cao→thấp) — hiển thị dạng BẢNG như Hố Hô + đường mảnh ngang hồ.
  var LEVELS=[['MNLKT',55.86,'#E24B4A'],['MNLTK',54.64,'#7F77DD'],['MNDBT',52.00,'#185FA5'],['Ngưỡng tràn',48.60,'#1D9E75'],['MNC',25.00,'#BA7517']];

  // ƯỚC LƯỢNG Q xả 1 cửa van cung (chỉ dùng cho BẢN XEM THỬ — thanh trượt). Trong console, Q lấy từ API
  // (HHT_QGATE); chưa nối cảm biến -> "–". Công thức: chảy tự do dưới cửa (lỗ) hoặc tràn khi mực nước thấp;
  // bề rộng khoang b=12,0 m, ngưỡng +48,6. THAY bằng nội suy bảng Z-a-Q thật khi có (nợ N-01).
  function Qgate(a,Z){ if(a==null||Z==null||a<=0||Z<=SILL) return 0; var b=12.0, gg=9.81, Zlip=SILL+a;
    if(Z<Zlip) return Math.round(2.0*b*Math.pow(Z-SILL,1.5));           // tràn đỉnh rộng (cửa chưa ngập)
    return Math.round(0.60*b*a*Math.sqrt(2*gg*(Z-SILL-a/2))); }         // chảy dưới cửa (lỗ)

           mới nào — mà lại đứng cạnh dòng nói giờ MỐC DỮ LIỆU. Hai đồng hồ, cái sai
           có nhãn thân thiện hơn. Một đại lượng, một chỗ nói (R-21). */
        _liveness();clearWait();
      })
      .catch(function(e){console.warn('[HHT data/fromto]',e.message);_pollOk=false;_liveness();});
  }

  function renderChart(){

    var fcd=fcDays();var _rt=window.__hhtRangeTo;window.__hhtFcEnd=(_rt!=null)?((_rt>Date.now())?_rt:null):((fcd>0)?(Date.now()+fcd*24*3600*1000):null);
    var times=o.times.slice(),qin=o.qin.slice(),qinRaw=o.qinRaw.slice(),qspill=o.qspill.slice(),qturb=o.qturb.slice(),qout=o.qout.slice(),mn=o.mn.slice(),rain=o.rain.slice(),zhl=o.zhl.slice(),vhc=o.vhc.slice();

        times.push(new Date(k));qin.push(g.qin!=null?g.qin:null);qinRaw.push(null);qspill.push(null);qturb.push(null);qout.push(null);mn.push(null);rain.push(g.rain!=null?g.rain:0);zhl.push(null);vhc.push(null);});
    }
    var _rObs=window.__hhtRainObs||[],rainT=[],rainV=[];for(var _ri=0;_ri<_rObs.length;_ri++){rainT.push(_rObs[_ri].t);rainV.push(_rObs[_ri].v);}if(fcd>0){(window.__hhtRainFc||[]).forEach(function(p){rainT.push(+p.t);rainV.push(p.mm);});}window.HHT_setChart({qin:qin,qinRaw:qinRaw,qspill:qspill,qturb:qturb,qout:qout,mn:mn,rain:rain,rainT:rainT,rainV:rainV,rainObsN:_rObs.length,times:times,zhl:zhl,vhc:vhc,ih:ih,now:new Date()});
  }

  function computeFc(fc,fcd){
    var a1=document.getElementById('kQmaxLbl');if(a1)a1.textContent='Lưu lượng vào max '+(fcd*24)+'h tới';
    var a2=document.getElementById('kWinLbl');if(a2)a2.textContent='Tổng lượng dự báo';
    if(!fc||!fc.length){setHTML('kQmax','– <small>m³/s</small>');setHTML('kWin','– <small>×10⁶ m³</small>');return;}
    var qm=0,w=0;for(var i=0;i<fc.length;i++){if(fc[i].v>qm)qm=fc[i].v;var dt=(i>0)?(fc[i].t-fc[i-1].t)/1000:3600;w+=fc[i].v*dt;}
    setHTML('kQmax',hntSo(qm,1)+' <small>m³/s</small>');
    setHTML('kWin',hntSo(w/1e6,1)+' <small>×10⁶ m³</small>');
  }

  // ===================== KÊNH SNAPSHOT: outlet/getall (độ mở + Q từng cửa) =====================
  function nameOf(o){return (o&&o.outlet_name||'').toUpperCase();}
  function findOut(arr,nm){for(var i=0;i<arr.length;i++)if(nameOf(arr[i])===nm)return arr[i];return null;}
  function _mapGates(j){var gs=(j&&j.data)||(Array.isArray(j)?j:[]);if(!gs.length){console.warn('[HHT gates] outlet/getall rỗng');return false;}var GM=(CFG&&CFG.gateMap)||null,OPEN={},QG={},MAN={},_hit=0;gs.forEach(function(o){var nm=((o&&o.outlet_name)||'')+'';var s=null;if(GM&&GM[nm]!=null)s=parseInt(GM[nm],10);else{var mm=nm.match(/[0-9]+/g);if(mm){for(var _i=0;_i<mm.length;_i++){var _n=parseInt(mm[_i],10);if(_n>=1&&_n<=7){s=_n;break;}}}}if(s==null||s<1||s>7)return;_hit++;OPEN[s]=num(o.input_value);QG[s]=num(o.output_value);var st=(o.status!=null)?parseInt(o.status,10):null;MAN[s]=(st!=null?(st===2):(!FILLSENSOR));setIn('g'+s,OPEN[s]!=null?OPEN[s]:0);});if(!_hit){console.warn('[HHT gates] không map được cửa nào từ outlet_name — cần CFG.gateMap (xem raw ở window.__hhtGatesRaw)');}for(var s=1;s<=7;s++){if(OPEN[s]===undefined)OPEN[s]=null;if(QG[s]===undefined)QG[s]=null;}window.HHT_OPEN=OPEN;window.HHT_QGATE=QG;window.HHT_MANUAL=MAN;if(window.HHT_renderSpill)window.HHT_renderSpill();return true;}window.HHT_gatesFromJSON=function(j){try{return _mapGates(j);}catch(e){console.error('[HHT gates test]',e);}};function applyGates(j){try{window.__hhtGatesRaw=j;console.log('[HHT NTR] outlet/getall (map theo CFG.gateMap hoặc số cửa trong outlet_name):',j);if(CFG.gateSensor!==true){var O={},Q={};for(var _s=1;_s<=7;_s++){O[_s]=null;Q[_s]=null;}window.HHT_OPEN=O;window.HHT_QGATE=Q;window.HHT_MANUAL={};if(window.HHT_renderSpill)window.HHT_renderSpill();return;}_mapGates(j);}catch(e){console.error('[HHT gates]',e);}}
  function pollGates(){
    /* FL-57: ảnh chụp cửa van nay cũng do máy chủ kéo, nằm trong cùng tệp lịch sử. */
    if(REPLAY){ return replayFetch(OUTLET_URL).then(function(r){return r.json();}).then(applyGates).catch(function(){}); }
    fetch(HIST_FILE+'?t='+Date.now(),{cache:'no-store'})
      .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
      .then(function(H){applyGates({data:H.gates||[]});})
      .catch(function(e){console.warn('[HHT gates]',e.message);});
  }

  // ===================== khởi động =====================
  // chặn dữ liệu minh hoạ của prototype hiện ra như thật cho tới khi có dữ liệu thật
  ['kMN','kQin','kQra','kRate','kQmax','kWin'].forEach(function(id){var e=document.getElementById(id);if(e)e.innerHTML='–';});
  (function(){var ch=document.getElementById('chart');if(ch)ch.innerHTML='';var lg=document.getElementById('legend');if(lg)lg.innerHTML='';})();
  (function(){var cb=document.getElementById('chartbox');if(cb&&!document.getElementById('hhtWait')){cb.style.position='relative';var o=document.createElement('div');o.id='hhtWait';o.textContent='Đang chờ số liệu…';o.style.cssText='position:absolute;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;background:rgba(21,24,29,.92);color:#9aa1a9;font-size:13px;z-index:5';cb.appendChild(o);}})();
  // Đổi Thời gian quan trắc / dự báo -> VỀ HIỆN TẠI (xoá khoảng lịch nếu đang xem quá khứ) rồi gọi lại.
  function _liveRefresh(){if(window.HHT_backToLive)window.HHT_backToLive();pollAll();if(window.HHT_LV&&window.HHT_LV.tick)window.HHT_LV.tick();}
  var so0=document.getElementById('selObs');if(so0)so0.addEventListener('change',_liveRefresh);
  var sf0=document.getElementById('selFc');if(sf0)sf0.addEventListener('change',_liveRefresh);
  // ===== 📅 Chọn mốc (calendar pick): đặt/xoá mốc neo cho cửa sổ dữ liệu =====
  window.HHT_ANCHOR=(typeof window.HHT_ANCHOR!=='undefined')?window.HHT_ANCHOR:null;
  window.HHT_ANCHOR_FROM=(typeof window.HHT_ANCHOR_FROM!=='undefined')?window.HHT_ANCHOR_FROM:null;
  window.HHT_ANCHOR_TO=(typeof window.HHT_ANCHOR_TO!=='undefined')?window.HHT_ANCHOR_TO:null;
  window.HHT_anchorLabel=function(){function p(n){return('0'+n).slice(-2);}function f(ms){var d=new Date(+ms);return p(d.getDate())+'/'+p(d.getMonth()+1)+' '+p(d.getHours())+':'+p(d.getMinutes());}
    if(window.HHT_ANCHOR_FROM!=null&&window.HHT_ANCHOR_TO!=null)return f(window.HHT_ANCHOR_FROM)+' → '+f(window.HHT_ANCHOR_TO);
    if(window.HHT_ANCHOR!=null)return f(window.HHT_ANCHOR);return null;};
  (function(){var af=document.getElementById('anchorFrom'),at=document.getElementById('anchorTo');
    function ymd(d){function p(n){return('0'+n).slice(-2);}return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
    function ms00(v){return v?new Date(v+'T00:00').getTime():null;} // ô NGÀY -> mốc 00:00 giờ ĐỊA PHƯƠNG (giờ hiển thị trên biểu đồ)
    function seed(){var e=new Date();e.setHours(0,0,0,0);var s=new Date(e.getTime()-3*24*3600*1000);if(af)af.value=ymd(s);if(at)at.value=ymd(e);}
    function apply(){var v1=ms00(af&&af.value),v2=ms00(at&&at.value);
      if(v1!=null&&v2!=null&&isFinite(v1)&&isFinite(v2)){if(v2<v1){var t=v1;v1=v2;v2=t;}window.HHT_ANCHOR_FROM=v1;window.HHT_ANCHOR_TO=v2;window.HHT_ANCHOR=v2;}
      else{window.HHT_ANCHOR_FROM=null;window.HHT_ANCHOR_TO=null;window.HHT_ANCHOR=null;}
      pollAll();if(window.HHT_LV&&window.HHT_LV.tick)window.HHT_LV.tick();}
    if(af)af.addEventListener('change',apply);if(at)at.addEventListener('change',apply);
    // Không còn nút "Trực tiếp": đổi Thời gian quan trắc / dự báo sẽ tự về hiện tại (xoá khoảng) — xem HHT_backToLive.

    seed();
  })();
  fresh('wait','đang lấy số liệu…');pollAll();pollGates();
  _hbTimer=setInterval(_liveness,LV.heartbeatMs);

     nhưng KHÔNG gọi SEHO — dừng là dừng. */
  function _sched(){var ms=_pollMs();_pollTimer=setTimeout(function(){if(_running){pollAll();pollGates();}else{_liveness();}_sched();},ms);}
  _schedStarted=true;_sched();
  window.HHT_pollAll=pollAll;window.HHT_pollGates=pollGates;
  // FL-57: `window.HHT_auth` đã gỡ cùng tầng đăng nhập — console không giữ token nữa.
  window.HHT_damMeta=function(){return _pullMeta;};
})();</script>

<script>
(function(){var cur='chart';
  function pad(x){return (x<10?'0':'')+x;}
  function fmtTime(d){if(!(d instanceof Date))d=new Date(d);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
  function n2(v){return v==null?'–':hntSo(v,2);}
  function n1(v){return v==null?'–':hntSo(v,1);}
  function nV(v){return v==null?'–':hntSo(v/1e6,2);}
  var COLS=[['t','Thời gian',fmtTime],['rain','Mưa|(mm)',n2],['qinRaw','Về hồ thô|(m³/s)',n2],['qin','Về hồ làm mượt|(m³/s)',n2],['qspill','Xả tràn|(m³/s)',n1],['qturb','Qua tua bin|(m³/s)',n1],['qout','Xả tổng|(m³/s)',n1],['mn','Mực nước hồ|(m)',n2],['zhl','Mực nước hạ lưu|(m)',n2],['vhc','Dung tích hồ|(10⁶m³)',nV]];
  function buildTable(){var rows=window.__hhtTable||[];var t=document.getElementById('opsTable');if(!t)return;
    var h='<thead><tr>';COLS.forEach(function(c){h+='<th>'+c[1].split('|').join('<br>')+'</th>';});h+='</tr></thead><tbody>';
    rows.slice().reverse().forEach(function(row){h+='<tr>';COLS.forEach(function(c){var raw=row[c[0]];var cls=(raw==null&&c[0]!=='t')?' class="nul"':'';h+='<td'+cls+'>'+c[2](raw)+'</td>';});h+='</tr>';});
    t.innerHTML=h+'</tbody>';var cn=document.getElementById('tblCount');if(cn)cn.textContent=rows.length+' dòng';}
  window.HHT_refreshTable=function(){if(cur==='table')buildTable();};
  function setView(v){cur=v;var cb=document.getElementById('chartbox'),tw=document.getElementById('tableWrap'),ex=document.getElementById('btnCSV');
    if(cb)cb.style.display=(v==='chart')?'':'none';if(tw)tw.style.display=(v==='table')?'':'none';if(ex)ex.style.display=(v==='table')?'':'none';
    [].forEach.call(document.querySelectorAll('.vtab'),function(b){b.classList.toggle('on',b.getAttribute('data-v')===v);});
    if(v==='table')buildTable();}
  [].forEach.call(document.querySelectorAll('.vtab'),function(b){b.addEventListener('click',function(){setView(b.getAttribute('data-v'));});});
  var btn=document.getElementById('btnCSV');if(btn)btn.addEventListener('click',function(){
    var rows=window.__hhtTable||[];if(!rows.length){alert('Chưa có dữ liệu để xuất.');return;}
    var head=COLS.map(function(c){return '"'+c[1].split('|').join(' ')+'"';}).join(',');var lines=[head];
    rows.forEach(function(row){lines.push(COLS.map(function(c){var v=row[c[0]];if(c[0]==='t')return '"'+fmtTime(v)+'"';return v==null?'':(+v);}).join(','));});
    var csv=String.fromCharCode(0xFEFF)+lines.join(String.fromCharCode(13,10));var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='NganTruoi_vanhanh_'+new Date().toISOString().slice(0,16).replace(/[:T]/g,'')+'.csv';
    document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);document.body.removeChild(a);},100);});
})();
</script>
