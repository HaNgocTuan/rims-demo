<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vận hành liên hồ — Ngàn Sâu</title>
<style>
:root{
  --bg:#0b1420;--panel:#111d2b;--panel2:#0d1826;--line:#22364a;--line-soft:#1a2b3d;
  --ink:#e9eff6;--mut:#9fb2c2;--mut2:#6f8598;--rt:#5fb6e6;--fc:#8b93d6;--ok:#7fcf9a;--warn:#e0b34a;--err:#e3564d;
  --d2:#a7d8f5;--d3:#6dbdec;--d4:#3a97dd;--d5:#1573c2;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Be Vietnam Pro",sans-serif;--mono:ui-monospace,"Roboto Mono",Menlo,monospace;--r:11px;}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--panel);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column}
#scroll{flex:1;overflow:auto;padding:12px 12px 8px}#scroll::-webkit-scrollbar{width:9px}#scroll::-webkit-scrollbar-thumb{background:#1c2f43;border-radius:9px}
.bandhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.bandhead .t{font-weight:800;font-size:14px}.bandhead .sysname{font-size:11px;color:var(--rt);font-weight:600}
.modeswitch{display:flex;gap:4px;background:#0b1622;border:1px solid var(--line-soft);border-radius:9px;padding:3px;margin-bottom:12px}
.modeswitch button{flex:1;border:0;background:transparent;color:var(--mut);font:700 12px var(--font);padding:6px;border-radius:6px;cursor:pointer}
.modeswitch button.on{background:var(--rt);color:#04121d}.modeswitch button.sim.on{background:var(--err);color:#fff}
.simcta{margin:0 0 12px;padding:11px;border-radius:11px;border:1px solid rgba(227,86,77,.4);background:linear-gradient(180deg,#1c1116,#12131e)}
.simcta .lab{font-size:11px;color:var(--mut);margin-bottom:8px}
.btn{border:1px solid var(--line);background:#0b1622;color:var(--ink);border-radius:9px;padding:7px 13px;font:600 12.5px var(--font);cursor:pointer}
.btn:hover{border-color:var(--rt)}
.btn.err{border-color:var(--err);color:#ffd7d2;background:rgba(227,86,77,.12);width:100%;font-weight:700}.btn.err:hover{background:rgba(227,86,77,.2)}
#verdict{border-radius:12px;padding:11px 12px;margin-bottom:12px;border:1px solid;position:relative;overflow:hidden}
#verdict::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px}
#verdict .vhead{display:flex;align-items:center;gap:9px}#verdict .dot{width:11px;height:11px;border-radius:50%;flex:none}
#verdict .vkind{font-weight:800;font-size:14.5px;line-height:1.16}#verdict .vwhy{color:var(--ink);opacity:.9;font-size:12px;margin-top:5px;line-height:1.4}
#verdict .vmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
#verdict .pill{font-family:var(--mono);font-size:10.5px;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
.v-ok{border-color:#33414d;background:linear-gradient(180deg,#0f1d2b,#0d1826)}.v-ok::before{background:var(--ok)}.v-ok .dot{background:var(--ok)}.v-ok .vkind{color:#bfeecb}
.v-warn{border-color:rgba(224,179,74,.45);background:linear-gradient(180deg,#241d0e,#141324)}.v-warn::before{background:var(--warn)}.v-warn .dot{background:var(--warn)}.v-warn .vkind{color:#ffdf9a}
.v-flood{border-color:rgba(227,86,77,.55);background:linear-gradient(180deg,#301114,#1a0e18)}.v-flood::before{background:var(--err)}.v-flood .dot{background:var(--err)}.v-flood .vkind{color:#ff8f83}
.prod{border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;background:var(--panel2);overflow:hidden}
.prod>.ph{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line-soft);background:linear-gradient(180deg,rgba(255,255,255,.02),transparent)}
.prod .tagbar{width:4px;align-self:stretch;border-radius:3px;min-height:16px}
.prod .ptitle{font-weight:800;font-size:11.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--mut)}
.prod .pnote{margin-left:auto;font-size:10.5px;color:var(--mut2)}.prod .pbody{padding:10px 12px}
.anchor{display:grid;grid-template-columns:1fr auto;gap:1px 8px;align-items:baseline;padding:7px 0;border-bottom:1px dashed rgba(255,255,255,.06)}
.anchor:last-child{border-bottom:0;padding-bottom:0}.anchor .nm{font-weight:600}.anchor .role{font-size:10.5px;color:var(--mut2);font-weight:400}
.anchor .val{font-family:var(--mono);font-weight:700;font-size:19px;text-align:right;letter-spacing:-.3px}.anchor .val small{font-size:11px;color:var(--mut);font-weight:400}
.bd{grid-column:1/3;margin-top:3px}.bdbar{position:relative;height:6px;border-radius:4px;background:#0b1622;border:1px solid var(--line-soft);overflow:hidden}
.bdbar>i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,#3a97dd,#e0b34a,#e3564d);transition:width .1s}
.bdticks{position:relative;height:11px;margin-top:1px}.bdticks span{position:absolute;transform:translateX(-50%);font-family:var(--mono);font-size:9px;color:var(--mut2)}
.chip{display:inline-block;font-family:var(--mono);font-size:10px;padding:1px 7px;border-radius:5px;font-weight:600}
.c-ok{color:#bfeecb;background:rgba(120,200,140,.14);border:1px solid rgba(120,200,140,.3)}
.c-bd1{color:#ffdf9a;background:rgba(224,179,74,.14);border:1px solid rgba(224,179,74,.36)}
.c-bd2{color:#ffbf95;background:rgba(224,140,60,.16);border:1px solid rgba(224,140,60,.4)}
.c-bd3{color:#ff9f95;background:rgba(227,86,77,.16);border:1px solid rgba(227,86,77,.42)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:#0b1622;border:1px solid var(--line-soft);border-radius:9px;padding:8px 9px}
.stat .lab{font-size:10.5px;color:var(--mut)}.stat .num{font-family:var(--mono);font-weight:700;font-size:18px;margin-top:2px;letter-spacing:-.3px}
.stat .u{font-size:11px;color:var(--mut);font-weight:400}.stat.hot .num{color:#ff9f95}.stat.hot{border-color:rgba(227,86,77,.3)}
.depthrow{display:flex;gap:5px;margin-top:9px}.depthrow .dc{flex:1;text-align:center;border-radius:7px;padding:5px 2px;border:1px solid var(--line-soft)}
.depthrow .dc .n{font-family:var(--mono);font-weight:700;font-size:13px}.depthrow .dc .l{font-size:9px;color:var(--mut2);margin-top:1px}
.dams{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dam{background:#0b1622;border:1px solid var(--line-soft);border-radius:9px;padding:9px}
.dam .dn{font-weight:700;font-size:12px;display:flex;align-items:center;gap:6px}.dam .dn .led{width:7px;height:7px;border-radius:50%}
.dam.calm .led{background:var(--ok);box-shadow:0 0 0 3px rgba(127,207,154,.16)}.dam.act .led{background:var(--warn);box-shadow:0 0 0 3px rgba(224,179,74,.16)}
.dam .kv{display:flex;justify-content:space-between;margin-top:6px;font-size:11.5px}.dam .kv .k{color:var(--mut)}.dam .kv .v{font-family:var(--mono);font-weight:600}
.dam .reg{margin-top:7px;font-size:10.5px}.dam.calm .reg{color:var(--mut)}.dam.act .reg{color:#ffbf95}
.hidden{display:none!important}
#dock{border-top:1px solid var(--line);background:var(--panel);padding:9px 12px 11px;display:none}
#dock.on{display:block}
#dockhead{display:flex;align-items:center;gap:10px;margin-bottom:5px}#dockhead .t{font-weight:800;font-size:12px}#dockhead .t b{color:#ff8f83}
#dockhead .lv{font-family:var(--mono);font-size:11.5px;color:var(--rt);font-weight:700}#dockhead .sp{margin-left:auto}
#rng{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:4px;background:#0b1622;border:1px solid var(--line-soft);outline:none;margin:6px 0 0}
#rng::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;background:var(--err);border:2px solid #fff;cursor:pointer}
#rng::-moz-range-thumb{width:17px;height:17px;border-radius:50%;background:var(--err);border:2px solid #fff;cursor:pointer}
#ticks{position:relative;height:12px;margin-top:2px}#ticks span{position:absolute;transform:translateX(-50%);font-family:var(--mono);font-size:9px;color:var(--mut2)}#ticks span.bd{color:var(--warn)}
.err{padding:14px;color:var(--err);font-size:13px}
</style>
</head>
<body>
<div id="scroll">
  <div class="bandhead"><div><div class="t">Vận hành liên hồ</div><div class="sysname">Hệ thống sông Ngàn Sâu · Hố Hô + Ngàn Trươi</div></div></div>
  <div class="modeswitch"><button id="mNow" class="on">Hiện nay</button><button id="mSim" class="sim">Mô phỏng 2020</button></div>
  <div id="ctaNow" class="simcta"><div class="lab">Sự kiện hiện tại không đáng kể. Xem lại một trận lũ lịch sử:</div><button class="btn err" id="btnSim2020">▶ Mô phỏng lũ 2020</button></div>
  <div id="verdict" class="v-ok"></div>
  <div class="prod"><div class="ph"><span class="tagbar" style="background:var(--rt)"></span><span class="ptitle">Trạm thuỷ văn</span><span class="pnote">mực nước (m)</span></div><div class="pbody" id="anchors"></div></div>
  <div class="prod"><div class="ph"><span class="tagbar" style="background:var(--fc)"></span><span class="ptitle">Ngập lụt hạ du</span><span class="pnote" id="impnote"></span></div><div class="pbody"><div class="stats" id="impstats"></div><div class="depthrow" id="depthrow"></div></div></div>
  <div class="prod"><div class="ph"><span class="tagbar" style="background:var(--warn)"></span><span class="ptitle">Vận hành hồ</span><span class="pnote" id="damnote"></span></div><div class="pbody"><div class="dams" id="dams"></div></div></div>
</div>
<div id="dock">
  <div id="dockhead"><span class="t"><b>MÔ PHỎNG</b> · Diễn biến lũ 2020</span><span class="lv" id="lvtxt">Chu Lễ – m</span><span class="sp"></span><button class="btn" id="btnReset">Về đầu</button><button class="btn" id="btnPlay">▶ Chạy</button></div>
  <input type="range" id="rng" min="0" max="1700" value="0" step="1"><div id="ticks"></div>
</div>
<script>
(function(){
"use strict";
var bc=null; try{bc=new BroadcastChannel('hydronet');}catch(e){}
function post(m){ try{bc&&bc.postMessage(m);}catch(e){} }
fetch('data.json').then(function(r){return r.json();}).then(init).catch(function(e){
  document.getElementById('scroll').innerHTML='<div class="err">Không đọc được data.json — '+e+'</div>'; });

function init(D){
var R=D.rungs,IMP=D.impact,THR=D.thr,CL=D.clusters,CUR=D.current;
var MINL=D.anchor.bankfull.chule,MAXL=D.anchor.peak.chule,mode='now';
function num(v,d){d=d==null?1:d;return (v==null)?'–':(Math.round(v*Math.pow(10,d))/Math.pow(10,d)).toString().replace('.',',');}
function lerp(a,b,t){return a+(b-a)*t;}
function interp(L,k){var a=IMP;if(L<=a[0].chule)return a[0][k];if(L>=a[a.length-1].chule)return a[a.length-1][k];
  for(var i=1;i<a.length;i++){if(a[i].chule>=L){var t=(L-a[i-1].chule)/(a[i].chule-a[i-1].chule);return lerp(a[i-1][k],a[i][k],t);}}return a[a.length-1][k];}
function pickRungIdx(L){var idx=0;for(var i=0;i<R.length;i++){if(R[i].chule<=L+1e-6)idx=i;}return idx;}
function bdOf(L){if(L>=THR['BĐIII'])return 3;if(L>=THR['BĐII'])return 2;if(L>=THR['BĐI'])return 1;return 0;}
function bdChip(L){var b=bdOf(L);if(b===3)return '<span class="chip c-bd3">TRÊN BĐ3</span>';if(b===2)return '<span class="chip c-bd2">TRÊN BĐ2</span>';
  if(b===1)return '<span class="chip c-bd1">TRÊN BĐ1</span>';if(L>=8)return '<span class="chip c-bd1">TRÀN BỜ</span>';return '<span class="chip c-ok">DƯỚI BĐ1</span>';}
function bdBar(L){var lo=4,hi=16.4,p=function(v){return Math.max(0,Math.min(100,(v-lo)/(hi-lo)*100));};
  return '<div class="bd"><div class="bdbar"><i style="width:'+p(L)+'%"></i></div><div class="bdticks"><span style="left:'+p(THR['BĐI'])+'%">BĐ1</span><span style="left:'+p(THR['BĐII'])+'%">BĐ2</span><span style="left:'+p(THR['BĐIII'])+'%">BĐ3</span></div></div>';}
function evacList(L){var g={};Object.keys(CL).forEach(function(k){var c=CL[k];if(c.chule<=L+1e-6)g[c.xa]=(g[c.xa]||0)+c.so_nha;});
  return Object.keys(g).map(function(x){return {xa:x,n:g[x]};}).sort(function(a,b){return b.n-a.n;});}
function anchor(nm,role,v,u,showBD){return '<div class="anchor"><div class="nm">'+nm+' <span class="role">· '+role+'</span>'+(showBD?(' '+bdChip(v)):'')+'</div><div class="val">'+num(v,2)+' <small>'+u+'</small></div>'+(showBD?bdBar(v):'')+'</div>';}
function stat(l,n,u,h){return '<div class="stat'+(h?' hot':'')+'"><div class="lab">'+l+'</div><div class="num">'+n+' <span class="u">'+u+'</span></div></div>';}
function dc(n,l,c){return '<div class="dc" style="border-color:'+c+'44"><div class="n" style="color:'+c+'">'+(n||0)+'</div><div class="l">'+l+'</div></div>';}
function damCard(nm,lk,inf,out,reg,act){return '<div class="dam '+(act?'act':'calm')+'"><div class="dn"><span class="led"></span>'+nm+'</div><div class="kv"><span class="k">MN hồ</span><span class="v">'+num(lk,1)+' m</span></div><div class="kv"><span class="k">Q vào</span><span class="v">'+num(inf,0)+' <span style="color:var(--mut)">m³/s</span></span></div><div class="kv"><span class="k">Q xả</span><span class="v">'+num(out,0)+' <span style="color:var(--mut)">m³/s</span></span></div><div class="reg">'+reg+'</div></div>';}
var elV=document.getElementById('verdict'),elA=document.getElementById('anchors'),elIS=document.getElementById('impstats'),
    elDR=document.getElementById('depthrow'),elIN=document.getElementById('impnote'),elDams=document.getElementById('dams'),
    elLv=document.getElementById('lvtxt'),elDamNote=document.getElementById('damnote');

function renderNow(){
  document.getElementById('ctaNow').classList.remove('hidden');
  elDamNote.textContent='dữ liệu thực · '+(CUR.hoho.ts||'');
  var L=CUR.chule,hd=CUR.hoaduyet; elLv.textContent='Chu Lễ '+num(L,1)+' m';
  elA.innerHTML=anchor('Chu Lễ','neo hạ du',L,'m',true)+anchor('Hòa Duyệt','cửa ra lưu vực',hd,'m',false)+anchor('Hố Hô','hạ lưu đập',CUR.hoho.down,'m',false);
  elV.className='v-ok';
  elV.innerHTML='<div class="vhead"><span class="dot"></span><span class="vkind">✅ An toàn — không có cảnh báo</span></div><div class="vwhy">Mực Chu Lễ '+num(L,2)+' m dưới báo động 1. Hai hồ vận hành bình thường, chưa ảnh hưởng hạ du.</div><div class="vmeta"><span class="pill">Chu Lễ <b>'+num(L,1)+'</b> m</span><span class="pill">DƯỚI BĐ1</span></div>';
  elIN.textContent='hiện tại';
  elIS.innerHTML=stat('Diện tích ngập','0','km²',false)+stat('Số hộ ảnh hưởng','0','hộ',false)+stat('Công trình ngập','0','ct',false)+stat('Sâu nhất','–','m',false);
  elDR.innerHTML=dc(0,'≤0,5m','var(--d2)')+dc(0,'0,5–1','var(--d3)')+dc(0,'1–2','var(--d4)')+dc(0,'>2m','var(--d5)');
  elDams.innerHTML=damCard('Hố Hô',CUR.hoho.lake,CUR.hoho.inflow,CUR.hoho.outflow,'Tuabin · chưa xả mặt',false)+damCard('Ngàn Trươi',CUR.ngantruoi.lake,CUR.ngantruoi.inflow,CUR.ngantruoi.outflow,'Đang tích · chưa xả',false);
  post({type:'flood:frame',mode:'now'});
}
function renderSim(L){
  document.getElementById('ctaNow').classList.add('hidden'); elDamNote.textContent='mô phỏng · đại diện';
  var ri=pickRungIdx(L),r=R[ri],hd=interp(L,'hoaduyet'); elLv.textContent='Chu Lễ '+num(L,1)+' m';
  elA.innerHTML=anchor('Chu Lễ','neo hạ du',L,'m',true)+anchor('Hòa Duyệt','cửa ra lưu vực',hd,'m',false)+anchor('Hố Hô','hạ lưu đập',22.5+(L-8)*0.16,'m',false);
  var b=bdOf(L),ev=evacList(L),cls,kind,why;
  if(L<8){cls='v-ok';kind='✅ An toàn — nước trong lòng sông';why='Mực Chu Lễ dưới ngang bờ (8,0 m).';}
  else if(b===0){cls='v-warn';kind='⚠ Bắt đầu tràn bờ hạ du';why='Đã vượt ngang bờ, dưới BĐ1.';}
  else if(b===1){cls='v-warn';kind='⚠ BĐ1 — Cảnh báo';why='Chu Lễ trên báo động 1. Ngập lan vùng dân cư ven sông.';}
  else if(b===2){cls='v-flood';kind='⛔ BĐ2 — Nguy hiểm';why='Chu Lễ trên báo động 2. Nhiều cụm dân cư ngập sâu.';}
  else{cls='v-flood';kind='⛔ BĐ3 — Khẩn cấp';why='Chu Lễ trên báo động 3. Ngập diện rộng, sơ tán khẩn.';}
  var evtxt=ev.length?('Ưu tiên sơ tán: '+ev.slice(0,3).map(function(e){return e.xa+' ('+e.n.toLocaleString('vi')+' nhà)';}).join(' · ')):'';
  elV.className=cls;
  elV.innerHTML='<div class="vhead"><span class="dot"></span><span class="vkind">'+kind+'</span></div><div class="vwhy">'+why+'</div><div class="vmeta"><span class="pill">Chu Lễ <b>'+num(L,1)+'</b> m</span>'+(ev.length?'<span class="pill">'+ev.length+' xã tràn bờ</span>':'')+'</div>'+(evtxt?'<div class="vwhy" style="margin-top:7px">'+evtxt+'</div>':'');
  var hh=interp(L,'households'),bt=interp(L,'buildings_total'),ar=interp(L,'area_km2'),byd=IMP[ri].buildings_by_depth;
  elIN.textContent='Chu Lễ ≈ '+num(r.chule,1)+' m';
  elIS.innerHTML=stat('Diện tích ngập',num(ar,1),'km²',L>=8)+stat('Số hộ ảnh hưởng',Math.round(hh).toLocaleString('vi'),'hộ',hh>0)+stat('Công trình ngập',Math.round(bt).toLocaleString('vi'),'ct',bt>0)+stat('Sâu nhất',(byd['200']>0?'>2':byd['100']>0?'1–2':byd['50']>0?'0,5–1':byd['15']>0?'≤0,5':'–'),'m',byd['200']>0);
  elDR.innerHTML=dc(byd['15'],'≤0,5m','var(--d2)')+dc(byd['50'],'0,5–1','var(--d3)')+dc(byd['100'],'1–2','var(--d4)')+dc(byd['200'],'>2m','var(--d5)');
  var f=Math.max(0,Math.min(1,(L-8)/(16.4-8)));
  elDams.innerHTML=damCard('Hố Hô',67.5+f*2.5,300+f*1500,280+f*1400,f>0.15?('Xả điều tiết · '+(f>0.6?'3':f>0.3?'2':'1')+' cửa'):'Tuabin',f>0.15)+damCard('Ngàn Trươi',51+f*3,200+f*1100,120+f*900,f>0.2?'Xả điều tiết':'Điều tiết',f>0.2);
  post({type:'flood:frame',mode:'sim',t:new Date().toISOString(),intensity:L,chule:L,hoaduyet:hd,ob:ev.map(function(e){return {name:e.xa,n:e.n,eta_h:0};}),imp:{households:Math.round(hh),buildings_total:Math.round(bt),area_km2:ar}});
}
var mNow=document.getElementById('mNow'),mSim=document.getElementById('mSim'),dock=document.getElementById('dock'),rng=document.getElementById('rng');
function sliderToL(v){return MINL+(v/1700)*(MAXL-MINL);}
function toNow(){mode='now';mNow.classList.add('on');mSim.classList.remove('on');dock.classList.remove('on');stopPlay();renderNow();}
function toSim(auto){mode='sim';mSim.classList.add('on');mNow.classList.remove('on');dock.classList.add('on');rng.value=0;renderSim(sliderToL(0));if(auto)startPlay();}
mNow.addEventListener('click',toNow);mSim.addEventListener('click',function(){toSim(false);});
document.getElementById('btnSim2020').addEventListener('click',function(){toSim(true);});
rng.addEventListener('input',function(){if(mode!=='sim')return;renderSim(sliderToL(+rng.value));});
(function(){var t=document.getElementById('ticks'),h='';[8,10,11.5,12.5,14,16.4].forEach(function(v){var isbd=(v===11.5||v===12.5||v===14),left=(v-MINL)/(MAXL-MINL)*100;h+='<span class="'+(isbd?'bd':'')+'" style="left:'+left+'%">'+(isbd?('BĐ'+(v===11.5?1:v===12.5?2:3)):num(v,1))+'</span>';});t.innerHTML=h;})();
var playing=false,timer=null,btnPlay=document.getElementById('btnPlay');
function stopPlay(){playing=false;btnPlay.textContent='▶ Chạy';if(timer){clearInterval(timer);timer=null;}}
function startPlay(){if(+rng.value>=1700)rng.value=0;playing=true;btnPlay.textContent='❚❚ Dừng';timer=setInterval(function(){var v=+rng.value+11;if(v>=1700){v=1700;rng.value=v;renderSim(sliderToL(v));stopPlay();return;}rng.value=v;renderSim(sliderToL(v));},110);}
btnPlay.addEventListener('click',function(){playing?stopPlay():startPlay();});
document.getElementById('btnReset').addEventListener('click',function(){stopPlay();rng.value=0;renderSim(sliderToL(0));});
toNow();
// nghe lệnh DỌN MÀN HÌNH từ addon (cục tẩy) → dừng tua + về Hiện nay
if(bc){ bc.onmessage=function(ev){ if(ev&&ev.data&&ev.data.type==='demo:stop'){ stopPlay(); toNow(); } }; }
window.addEventListener('pagehide',function(){post({type:'flood:frame',mode:'now'});stopPlay();});
}
})();
</script>
